plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.1.4'
group = 'sbm-charcoalblock'

base {
	archivesName = 'SBM-CharcoalBlock-26.1.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

neoForge {
	version = "26.1.1.6-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "SBMCharcoalBlock " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', 'sbmcharcoalblock', '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		sbmcharcoalblock {
			sourceSet(sourceSets.main)
		}
	}
}

tasks.named('jar', Jar).configure {
	exclude('com/builtbroken/ccb/datagen/**') //exclude files from the built jar that are only used to generate the assets & data

    manifest {
        attributes(["Specification-Title": "SBM-CharcoalBlock",
                    "Specification-Vendor": "Built Broken Modding",
                    "Specification-Version": "1",
                    "Implementation-Title": "SBM-CharcoalBlock",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "Built Broken Modding"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 25
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}